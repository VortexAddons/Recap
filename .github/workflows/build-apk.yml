name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate Flutter App Directory
        id: find_app
        run: |
          # Find directory containing pubspec.yaml
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$PUBSPEC_PATH")
          echo "App directory is: $APP_DIR"
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT

      - name: Get Dependencies
        run: |
          cd ${{ steps.find_app.outputs.app_dir }}
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ steps.find_app.outputs.app_dir }}
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recap-release-apk
          path: ${{ steps.find_app.outputs.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
